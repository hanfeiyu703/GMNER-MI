[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eler-core"
version = "0.1.0"
description = "Generative entity extraction and multi-image grounding"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6,<3",
    "transformers==5.12.1",
    "peft==0.18.0",
    "Pillow>=10",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["eler*"]
